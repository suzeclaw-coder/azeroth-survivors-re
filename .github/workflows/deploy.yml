name: Build and Deploy to VM via Tailscale

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Uses GitHub's free ARM64 runner for public repos, matching Oracle Ampere A1 (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: tools

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev brotli

      - name: Validate Survivor Asset Paths
        run: |
          if grep -rn 'asset_server\.load("fonts/' crates/benilla-app/src/survivors/; then
            echo "::error::Hardcoded font path found without mpq:// protocol!"
            exit 1
          fi

      - name: Setup WebAssembly toolchain
        run: scripts/web-setup.sh

      - name: Build WebGPU Client (WASM)
        run: scripts/web-build.sh

      - name: Build Host Server (wenilla-host)
        run: cargo build --release -p wenilla-host

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to Oracle VM via Tailscale
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || 22022 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i ~/.ssh/id_ed25519"

          # Determine accessible SSH port (try configured port, fallback to 22)
          TARGET_PORT="$VM_PORT"
          echo "Testing SSH connection to $VM_HOST on port $TARGET_PORT..."
          if ! ssh $SSH_OPTS -p "$TARGET_PORT" "$VM_USER@$VM_HOST" "echo SSH_OK" 2>/dev/null; then
            echo "Port $TARGET_PORT unreachable, falling back to port 22..."
            TARGET_PORT="22"
            ssh $SSH_OPTS -p "$TARGET_PORT" "$VM_USER@$VM_HOST" "echo SSH_OK"
          fi
          echo "Using port $TARGET_PORT for deployment."

          # 1. Prepare staging directory on VM
          ssh $SSH_OPTS -p "$TARGET_PORT" "$VM_USER@$VM_HOST" "rm -rf /opt/azeroth-survivors/staging && mkdir -p /opt/azeroth-survivors/staging/dist"

          # 2. Upload binary and web dist assets
          scp $SSH_OPTS -P "$TARGET_PORT" target/release/wenilla-host "$VM_USER@$VM_HOST:/opt/azeroth-survivors/staging/wenilla-host"
          scp $SSH_OPTS -P "$TARGET_PORT" -r web/dist/* "$VM_USER@$VM_HOST:/opt/azeroth-survivors/staging/dist/"

          # 3. Atomically replace files & restart service
          ssh $SSH_OPTS -p "$TARGET_PORT" "$VM_USER@$VM_HOST" 'bash -se' << 'EOF'
            chmod +x /opt/azeroth-survivors/staging/wenilla-host
            mv /opt/azeroth-survivors/staging/wenilla-host /opt/azeroth-survivors/bin/wenilla-host
            cp -r /opt/azeroth-survivors/staging/dist/* /opt/azeroth-survivors/dist/
            rm -rf /opt/azeroth-survivors/staging
            sudo systemctl restart azeroth-survivors.service
            sudo systemctl status azeroth-survivors.service --no-pager

            # 4. Post-deploy Automated Health Check
            echo "Waiting for service to stabilize..."
            sleep 2
            if ! systemctl is-active --quiet azeroth-survivors.service; then
              echo "::error::azeroth-survivors.service failed to stay active!"
              sudo systemctl status azeroth-survivors.service --no-pager
              exit 1
            fi

            # Check HTTP 200 response
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8095/ || true)
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "::error::Health check failed! HTTP endpoint returned status $HTTP_STATUS"
              exit 1
            fi

            echo "==> Health check passed (HTTP 200, systemd active)! Game is live on your private Tailscale network <=="
          EOF
